<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상수 피팅 계산기</title>
<style>
:root{--bg:#000;--card:#000;--line:#2a2a2a;--text:#fff;--sub:#a1a1a1;--green:#22c55e;--red:#f87171;--btn:#ececec;--btn-text:#111;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f6f6;--card:#fff;--line:#dcdcdc;--text:#111;--sub:#666;--green:#16a34a;--red:#dc2626;--btn:#111;--btn-text:#fff;color-scheme:light}}
:root[data-theme="dark"]{--bg:#000;--card:#000;--line:#2a2a2a;--text:#fff;--sub:#a1a1a1;--green:#22c55e;--red:#f87171;--btn:#ececec;--btn-text:#111}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}
.badge{font-size:11px;color:var(--green);border:1px solid var(--green);border-radius:99px;padding:2px 9px}
.hint{font-size:12px;color:var(--sub);margin:10px 0 14px}
.card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 14px 10px;margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card-h b{font-size:14px}
.del{background:none;border:0;color:var(--red);cursor:pointer;padding:4px;font-size:16px;line-height:1}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}
select{width:100%;appearance:none;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:9px 28px 9px 12px;font:inherit;font-size:13px;font-weight:600;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.spec{text-align:right;font-size:11px;color:var(--sub);margin-top:8px}
button:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.add{width:100%;padding:10px;border:1px solid var(--line);border-radius:99px;background:none;color:var(--text);font:inherit;font-size:13px;cursor:pointer}
.res{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}
.res-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.res-h b{font-size:14px}
.big{font-size:24px;font-weight:800;color:var(--green)}
.item{display:flex;justify-content:space-between;font-size:13px;padding:6px 0}
.item b{font-weight:700}
.empty{color:var(--sub);font-size:13px;padding:6px 0}
.total{border-top:1px solid var(--line);margin-top:14px;padding-top:16px;display:flex;justify-content:space-between;align-items:center}
.total b:first-child{font-size:14px}
.total b:last-child{font-size:24px;font-weight:800}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.actions button{padding:11px;border-radius:99px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.reset{background:none;border:1px solid var(--line);color:var(--text)}
.copy{background:var(--btn);border:1px solid var(--btn);color:var(--btn-text)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>상수 피팅 계산기</h1><span class="badge">자동 계산</span></header>
  <p class="hint">각 피팅의 연결 규격을 다이얼로 선택하세요.</p>
  <div id="list"></div>
  <button class="add" id="add">＋ 피팅 추가</button>
  <section class="res">
    <div id="items"></div>
    <div class="total"><b>전체 피팅 수량</b><b id="total">0개</b></div>
    <div class="actions">
      <button class="reset" id="reset">전체 초기화</button>
      <button class="copy" id="copy">결과 복사</button>
    </div>
  </section>
</div>
<script>
var SIZES=['1 1/4"','1"','3/4"','1/2"'];
var VAL={'1/2"':0.5,'3/4"':0.75,'1"':1,'1 1/4"':1.25};
var fittings=[];
function newFit(){return {a:'1/2"',b:'1/2"',c:'1/2"'}}
function spec(f){return f.a.replace('"','')+' × '+f.b.replace('"','')+' × '+f.c.replace('"','')+' T'}
function opts(v,k,f){return SIZES.filter(function(s){return k==='a'||VAL[s]<=VAL[f.a]}).map(function(s){return '<option'+(s===v?' selected':'')+'>'+s+'</option>'}).join('')}
function renderList(){
  var el=document.getElementById('list');
  el.innerHTML=fittings.map(function(f,i){
    return '<div class="card"><div class="card-h"><b>피팅 '+(i+1)+'</b><button class="del" data-del="'+i+'" aria-label="피팅 '+(i+1)+' 삭제">🗑</button></div>'+
    '<div class="row">'+
    ['a','b','c'].map(function(k,j){return '<div><label>'+['첫 번째','두 번째','세 번째'][j]+'</label><select data-i="'+i+'" data-k="'+k+'">'+opts(f[k],k,f)+'</select></div>'}).join('')+
    '</div><div class="spec" id="spec'+i+'">'+spec(f)+'</div></div>';
  }).join('');
}
function groups(){
  var m={},order=[];
  fittings.forEach(function(f){var s=spec(f);if(!m[s]){m[s]=0;order.push(s)}m[s]++});
  return order.map(function(s){return [s,m[s]]});
}
function renderResult(){
  var g=groups(),tot=fittings.length;
  document.getElementById('total').textContent=tot+'개';
  document.getElementById('items').innerHTML=g.length?g.map(function(x){return '<div class="item"><span>'+x[0]+'</span><b>'+x[1]+'개</b></div>'}).join(''):'<div class="empty">피팅을 추가해 주세요.</div>';
}
document.getElementById('list').addEventListener('change',function(e){
  var t=e.target;if(t.tagName!=='SELECT')return;
  var i=+t.dataset.i,k=t.dataset.k,f=fittings[i];f[k]=t.value;
  if(k==='a'){
    if(VAL[f.b]>VAL[f.a])f.b=f.a;
    if(VAL[f.c]>VAL[f.a])f.c=f.a;
    renderList();
  }else{
    document.getElementById('spec'+i).textContent=spec(f);
  }
  renderResult();
});
document.getElementById('list').addEventListener('click',function(e){
  var b=e.target.closest('[data-del]');if(!b)return;
  fittings.splice(+b.dataset.del,1);renderList();renderResult();
});
document.getElementById('add').onclick=function(){fittings.push(newFit());renderList();renderResult()};
document.getElementById('reset').onclick=function(){fittings=[newFit()];renderList();renderResult()};
document.getElementById('copy').onclick=function(){
  var g=groups();
  var text=g.map(function(x){return x[0]+'  '+x[1]+'개'}).join('\n')+'\n전체 '+fittings.length+'개';
  var btn=document.getElementById('copy');
  function done(ok){btn.textContent=ok?'복사됨':'복사 실패';setTimeout(function(){btn.textContent='결과 복사'},1500)}
  try{navigator.clipboard.writeText(text).then(function(){done(true)},function(){fallback()})}catch(e){fallback()}
  function fallback(){
    try{var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);done(ok)}catch(e){done(false)}
  }
};
fittings=[newFit()];
renderList();renderResult();
</script>
</body>
</html>
