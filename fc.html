<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>상수 피팅 계산기</title>
<style>
:root{--bg:#000;--card:#000;--line:#2a2a2a;--text:#fff;--sub:#a1a1a1;--green:#22c55e;--red:#f87171;--btn:#ececec;--btn-text:#111;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f6f6;--card:#fff;--line:#dcdcdc;--text:#111;--sub:#666;--green:#16a34a;--red:#dc2626;--btn:#111;--btn-text:#fff;color-scheme:light}}
:root[data-theme="dark"]{--bg:#000;--card:#000;--line:#2a2a2a;--text:#fff;--sub:#a1a1a1;--green:#22c55e;--red:#f87171;--btn:#ececec;--btn-text:#111}
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{user-select:none;-webkit-user-select:none}
body{background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}
.badge{font-size:11px;color:var(--green);border:1px solid var(--green);border-radius:99px;padding:2px 9px}
.hint{font-size:12px;color:var(--sub);margin:10px 0 14px}
.card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 14px 12px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:7px 2px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--sub);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.seg button{font-size:12px}
.seg button.on{background:var(--btn);border-color:var(--btn);color:var(--btn-text)}
.row{display:grid;gap:8px}
label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}
select{width:100%;appearance:none;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:9px 28px 9px 12px;font:inherit;font-size:16px;font-weight:600;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.spec{text-align:right;font-size:11px;color:var(--sub);margin-top:8px;min-height:16px}
button:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.add{width:100%;padding:11px;margin-top:6px;border:0;border-radius:99px;background:var(--btn);color:var(--btn-text);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.add:disabled{opacity:.35;cursor:not-allowed}
.res{border-top:1px solid var(--line);margin-top:22px;padding-top:12px}
.item{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.item .nm{flex:1}
.item b{font-weight:700;min-width:34px;text-align:right}
.ib{background:none;border:1px solid var(--line);color:var(--text);border-radius:99px;width:28px;height:28px;font-size:15px;line-height:1;cursor:pointer;padding:0}
.ib.del{border:0;color:var(--red);font-size:16px}
.empty{color:var(--sub);font-size:13px;padding:8px 0}
.total{margin-top:14px;padding-top:6px;display:flex;justify-content:space-between;align-items:center}
.total b:first-child{font-size:14px}
.total b:last-child{font-size:24px;font-weight:800}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.actions button{padding:11px;border-radius:99px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.reset{background:none;border:1px solid var(--line);color:var(--text)}
.copy{background:var(--btn);border:1px solid var(--btn);color:var(--btn-text)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>상수 피팅 계산기</h1><span class="badge">자동 계산</span></header>
  <p class="hint">규격을 고르고 추가를 누르면 아래 목록에 쌓입니다.</p>
  <div class="card" id="form"></div>
  <section class="res">
    <div id="items"></div>
    <div class="total"><b>전체 피팅 수량</b><b id="total">0개</b></div>
    <div class="actions">
      <button class="reset" id="reset">전체 초기화</button>
      <button class="copy" id="copy">결과 복사</button>
    </div>
  </section>
</div>
<script>
var SIZES=['1 1/4"','1"','3/4"','1/2"'];
var VAL={'1/2"':0.5,'3/4"':0.75,'1"':1,'1 1/4"':1.25};
var NEED={T:3,L:2,C:1,R:2};
var LABEL={T:'Tee',L:'Elbow',C:'Coupling',R:'Reducer'};
var form={t:'T',a:'',b:'',c:''};
var list=[];
function strip(s){return s.replace('"','')}
function spec(f){
  var n=NEED[f.t];if(!f.a||(n>1&&!f.b)||(n>2&&!f.c))return '';if(f.t==='C')return strip(f.a)+' '+LABEL.C;
  var s=strip(f.a)+' × '+strip(f.b);
  return f.t==='T'?s+' × '+strip(f.c)+' '+LABEL.T:s+' '+LABEL[f.t];
}
function fix(){
  if(!form.a)return;
  var A=VAL[form.a];
  if(form.b&&(form.t==='R'?VAL[form.b]>=A:VAL[form.b]>A))form.b=form.t==='R'?'':form.a;
  if(form.c&&VAL[form.c]>A)form.c=form.a;
}
function opts(v,k){
  return '<option value="" disabled'+(v?'':' selected')+'>선택</option>'+
    SIZES.filter(function(s){return k==='a'||(form.t==='R'&&k==='b'?VAL[s]<VAL[form.a]:VAL[s]<=VAL[form.a])}).map(function(s){
      return '<option'+(s===v?' selected':'')+'>'+s+'</option>';
    }).join('');
}
function renderForm(){
  var cols=['a','b','c'].slice(0,NEED[form.t]);
  var names=form.t==='R'?['큰 쪽','작은 쪽']:NEED[form.t]===1?['규격']:['첫 번째','두 번째','세 번째'];
  document.getElementById('form').innerHTML=
    '<div class="seg">'+['T','L','C','R'].map(function(t){
      return '<button class="'+(form.t===t?'on':'')+'" data-type="'+t+'">'+LABEL[t]+'</button>';
    }).join('')+'</div>'+
    '<div class="row" style="grid-template-columns:repeat('+cols.length+',1fr)">'+
    cols.map(function(k,j){
      return '<div><label>'+names[j]+'</label><select data-k="'+k+'">'+opts(form[k],k)+'</select></div>';
    }).join('')+'</div>'+
    '<div class="spec">'+spec(form)+'</div>'+
    '<button class="add" data-add="1"'+(spec(form)?'':' disabled')+'>＋ 추가</button>';
}
function total(){return list.reduce(function(n,x){return n+x.n},0)}
function renderList(){
  document.getElementById('total').textContent=total()+'개';
  document.getElementById('items').innerHTML=list.length?list.map(function(x,i){
    return '<div class="item"><span class="nm">'+x.s+'</span>'+
      '<button class="ib" data-dec="'+i+'" aria-label="하나 빼기">−</button>'+
      '<b>'+x.n+'개</b>'+
      '<button class="ib" data-inc="'+i+'" aria-label="하나 더하기">+</button>'+
      '<button class="ib del" data-del="'+i+'" aria-label="삭제">🗑</button></div>';
  }).join(''):'<div class="empty">추가한 피팅이 여기에 표시됩니다.</div>';
}
document.getElementById('form').addEventListener('change',function(e){
  var t=e.target;if(t.tagName!=='SELECT')return;
  var k=t.dataset.k;form[k]=t.value;
  if(k==='a')fix();
  renderForm();
});
document.getElementById('form').addEventListener('click',function(e){
  var tb=e.target.closest('[data-type]');
  if(tb){form.t=tb.dataset.type;fix();renderForm();return}
  if(e.target.closest('[data-add]')){
    var s=spec(form);if(!s)return;
    var found=list.filter(function(x){return x.s===s})[0];
    if(found)found.n++;else list.push({s:s,n:1});
    form.a='';form.b='';form.c='';
    renderForm();renderList();
  }
});
document.getElementById('items').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var d=b.dataset;
  if(d.inc!==undefined)list[+d.inc].n++;
  else if(d.dec!==undefined){var i=+d.dec;list[i].n--;if(list[i].n<1)list.splice(i,1)}
  else if(d.del!==undefined)list.splice(+d.del,1);
  renderList();
});
document.getElementById('reset').onclick=function(){list=[];form={t:form.t,a:'',b:'',c:''};renderForm();renderList()};
document.getElementById('copy').onclick=function(){
  var text=list.map(function(x){return x.s+'  '+x.n+'개'}).join('\n')+'\n전체 '+total()+'개';
  var btn=document.getElementById('copy');
  function done(ok){btn.textContent=ok?'복사됨':'복사 실패';setTimeout(function(){btn.textContent='결과 복사'},1500)}
  function fallback(){
    try{var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);done(ok)}catch(e){done(false)}
  }
  try{navigator.clipboard.writeText(text).then(function(){done(true)},fallback)}catch(e){fallback()}
};
renderForm();renderList();
document.addEventListener('gesturestart',function(e){e.preventDefault()});
</script>
</body>
</html>
